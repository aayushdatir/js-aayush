<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Chai aur Code</title>
    <style>
        body{
            background-color: #212121; color: white;
        }
    </style>
</head>
<body>
    <div>
        <ul class="languages">
            <li>Javascript</li>
        </ul>
    </div>

    <script>

        function addLang(language){
            const li = document.createElement('li')
            li.appendChild(document.createTextNode(language))
            document.querySelector('.languages').appendChild(li)
        }

        addLang("GoLang")
        addLang("C++")


        //Edit
        const secondLi = document.querySelector('li:nth-child(2)')
        //console.log(secondLi)
        // newli.innerHTML = "Java"
        const newLi = document.createElement('li')
        newLi.textContent = "Java"
        secondLi.replaceWith(newLi)

        //Edit
        const firstLi = document.querySelector('li:first-child')
        firstLi.outerHTML = '<li>PHP</li>'

        //remove
        const lastLi = document.querySelector('li:last-child')
        // console.log(lastLi)
        lastLi.remove()

    </script>
</body>
</html>
